name: VS Code companion

on:
  push:
    branches: [master]
    paths: ["vscode/**", "compat/**", ".github/workflows/vscode.yml"]
    tags: ["vscode-v*"]
  pull_request:
    paths: ["vscode/**", "compat/**", ".github/workflows/vscode.yml"]
  workflow_dispatch:
    inputs:
      plugins_ref:
        description: knobdeck-plugins branch or tag to test against
        default: master

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The KnobDeck `vscode` plugin, built from source, so the tests drive the real thing.
      - uses: actions/checkout@v4
        with:
          repository: HarshalKudale/knobdeck-plugins
          ref: ${{ inputs.plugins_ref || 'master' }}
          path: knobdeck-plugins
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: knobdeck-plugins
      - name: Build the KnobDeck vscode plugin
        working-directory: knobdeck-plugins
        run: cargo build --release -p vscode
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
        working-directory: vscode
      - name: Unit and plugin tests
        working-directory: vscode
        shell: bash
        run: |
          bin="$GITHUB_WORKSPACE/knobdeck-plugins/target/release"
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          KNOBDECK_VSCODE_PLUGIN="$bin/vscode$ext" KNOBDECK_VSCODE_SETUP="$bin/vscode-setup$ext" npm test
      - name: End-to-end in VS Code
        working-directory: vscode
        shell: bash
        run: |
          bin="$GITHUB_WORKSPACE/knobdeck-plugins/target/release"
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          export KNOBDECK_VSCODE_PLUGIN="$bin/vscode$ext"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run test:e2e; else npm run test:e2e; fi

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
        working-directory: vscode
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        working-directory: vscode
        run: test "vscode-v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npx vsce package --no-dependencies --skip-license -o knobdeck-vscode-companion.vsix
        working-directory: vscode
      - uses: actions/upload-artifact@v4
        with:
          name: knobdeck-vscode-companion
          path: vscode/knobdeck-vscode-companion.vsix

  publish:
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
        working-directory: vscode
      - uses: actions/download-artifact@v4
        with:
          name: knobdeck-vscode-companion
          path: vscode
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" vscode/knobdeck-vscode-companion.vsix --title "VS Code companion ${GITHUB_REF_NAME#vscode-v}" --notes-file vscode/CHANGELOG.md
      - name: Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        working-directory: vscode
        run: npx vsce publish --packagePath knobdeck-vscode-companion.vsix
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        working-directory: vscode
        run: npx ovsx publish knobdeck-vscode-companion.vsix

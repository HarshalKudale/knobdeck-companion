name: IntelliJ companion

on:
  push:
    branches: [master]
    paths: ["intellij/**", "compat/**", ".github/workflows/intellij.yml"]
    tags: ["intellij-v*"]
  pull_request:
    paths: ["intellij/**", "compat/**", ".github/workflows/intellij.yml"]
  workflow_dispatch:
    inputs:
      plugins_ref:
        description: knobdeck-plugins branch or tag to test against
        default: master

defaults:
  run:
    working-directory: intellij

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Knobdeck/knobdeck-plugins
          ref: ${{ inputs.plugins_ref || 'master' }}
          path: knobdeck-plugins
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: knobdeck-plugins
      - name: Build the KnobDeck intellij plugin
        working-directory: knobdeck-plugins
        run: cargo build --release -p intellij
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/intellij-v')
        run: test "intellij-v$(grep '^pluginVersion=' gradle.properties | cut -d= -f2)" = "${GITHUB_REF_NAME}"
      - name: Test (drives the real KnobDeck plugin)
        env:
          KNOBDECK_INTELLIJ_PLUGIN: ${{ github.workspace }}/knobdeck-plugins/target/release/intellij
          KNOBDECK_INTELLIJ_SETUP: ${{ github.workspace }}/knobdeck-plugins/target/release/intellij-setup
        run: ./gradlew test --console=plain
      - name: Build
        run: ./gradlew buildPlugin --console=plain
      - name: Verify against IntelliJ 2024.3, 2025.3 and 2026.3
        run: ./gradlew verifyPlugin --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: knobdeck-intellij-companion
          path: intellij/build/distributions/*.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: intellij/build/reports

  publish:
    if: startsWith(github.ref, 'refs/tags/intellij-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Sign and publish to JetBrains Marketplace
        env:
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        if: env.JETBRAINS_MARKETPLACE_TOKEN != ''
        run: ./gradlew publishPlugin --console=plain
      - name: Build (no Marketplace token)
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        if: env.JETBRAINS_MARKETPLACE_TOKEN == ''
        run: ./gradlew buildPlugin --console=plain
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls build/distributions/*.zip | head -1)
          gh release create "$GITHUB_REF_NAME" "$zip" --title "IntelliJ companion ${GITHUB_REF_NAME#intellij-v}" --notes "See CHANGELOG.html."
